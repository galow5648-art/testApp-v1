<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авиасейлс</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233B82F6'/%3E%3Cpath d='M7 15L12 8L17 15' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    <style>
        :root {
          --bg: #0A0D14;
          --card: #121621;
          --card-hover: #161B29;
          --border: rgba(255,255,255,0.08);
          --border-strong: rgba(255,255,255,0.14);
          --text: #E7E9EE;
          --text-muted: #8B93A6;
          --text-faint: #565D6E;
          --accent: #3B82F6;
          --accent-hover: #5B96F8;
          --accent-bg: rgba(59,130,246,0.12);
          --success: #34D399;
          --success-bg: rgba(52,211,153,0.10);
          --pending: #F5A524;
          --pending-bg: rgba(245,165,36,0.10);
          --danger: #F26E6E;
          --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          --font-mono: 'JetBrains Mono', ui-monospace, monospace;
          --radius: 10px;
        }

        * { box-sizing: border-box; }

        body {
          margin: 0;
          font-family: var(--font);
          background: var(--bg);
          color: var(--text);
          -webkit-font-smoothing: antialiased;
          font-size: 14px;
          line-height: 1.5;
        }

        .wrap {
          max-width: 720px;
          margin: 0 auto;
          padding: 48px 24px 64px;
        }

        .top-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 40px;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .brand-mark {
          width: 26px;
          height: 26px;
          border-radius: 7px;
          background: var(--accent);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .brand-mark svg { width: 15px; height: 15px; }

        .brand-name {
          font-weight: 700;
          font-size: 16px;
          letter-spacing: -0.01em;
          color: var(--text);
        }

        .env-badge {
          font-family: var(--font-mono);
          font-size: 11px;
          letter-spacing: 0.04em;
          color: var(--text-faint);
          border: 1px solid var(--border);
          border-radius: 6px;
          padding: 3px 8px;
        }

        .card {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 20px;
          margin-bottom: 14px;
        }

        .card h3 {
          font-size: 12px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: var(--text-muted);
          margin: 0 0 14px;
        }

        #auth-section {
          max-width: 420px;
          margin: 40px auto 0;
        }

        #auth-section .card { padding: 28px; }

        .auth-title {
          font-size: 18px;
          font-weight: 600;
          margin: 0 0 20px;
          color: var(--text);
        }

        .tabs {
          display: flex;
          background: rgba(255,255,255,0.04);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 3px;
          margin-bottom: 18px;
        }

        .tab-btn {
          flex: 1;
          padding: 8px;
          border: none;
          border-radius: 6px;
          background: transparent;
          color: var(--text-muted);
          font-family: var(--font);
          font-weight: 500;
          font-size: 13px;
          cursor: pointer;
          transition: background 0.15s ease, color 0.15s ease;
        }

        .tab-btn.active {
          background: var(--card-hover);
          color: var(--text);
          box-shadow: 0 1px 0 var(--border-strong) inset;
        }

        .field { margin-bottom: 12px; }

        input[type="email"], input[type="password"] {
          width: 100%;
          padding: 10px 12px;
          background: rgba(255,255,255,0.03);
          border: 1px solid var(--border);
          border-radius: 8px;
          color: var(--text);
          font-family: var(--font);
          font-size: 14px;
          transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input::placeholder { color: var(--text-faint); }

        input:focus {
          outline: none;
          border-color: var(--accent);
          box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .btn-primary {
          width: 100%;
          padding: 11px;
          background: var(--accent);
          border: none;
          border-radius: 8px;
          color: white;
          font-family: var(--font);
          font-weight: 600;
          font-size: 14px;
          cursor: pointer;
          transition: background 0.15s ease, transform 0.08s ease;
        }

        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.985); }

        #msg {
          font-size: 13px;
          margin-top: 10px;
          min-height: 16px;
        }

        #msg.error { color: var(--danger); }

        .user-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .user-bar span { color: var(--text-muted); font-size: 13px; }
        .user-bar b { color: var(--text); font-weight: 600; }

        .btn-ghost {
          padding: 7px 14px;
          background: transparent;
          border: 1px solid var(--border-strong);
          border-radius: 7px;
          color: var(--text);
          font-family: var(--font);
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          transition: border-color 0.15s ease, background 0.15s ease;
        }

        .btn-ghost:hover { border-color: var(--text-faint); background: rgba(255,255,255,0.03); }

        .flight-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 14px;
          padding: 12px 4px;
          border-radius: 8px;
          transition: background 0.12s ease;
        }

        .flight-row:hover { background: rgba(255,255,255,0.03); }

        .flight-info {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }

        .flight-code {
          font-family: var(--font-mono);
          font-weight: 500;
          font-size: 13px;
          color: var(--text-muted);
        }

        .flight-route {
          font-size: 14px;
          font-weight: 500;
          color: var(--text);
        }

        .btn-buy {
          padding: 7px 14px;
          background: transparent;
          border: 1px solid var(--border-strong);
          border-radius: 7px;
          color: var(--text);
          font-family: var(--font);
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          white-space: nowrap;
          transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .btn-buy:hover { border-color: var(--accent); color: var(--accent-hover); background: var(--accent-bg); }

        .muted-note {
          color: var(--text-faint);
          font-size: 13px;
          margin: 4px;
        }

        .ticket {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 14px;
          padding: 12px 14px;
          background: rgba(255,255,255,0.02);
          border: 1px solid var(--border);
          border-radius: 8px;
          margin-bottom: 8px;
        }

        .ticket:last-child { margin-bottom: 0; }

        .ticket-body {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }

        .ticket-route { font-size: 14px; font-weight: 500; color: var(--text); }

        .ticket-meta {
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--text-faint);
        }

        .ticket-side {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-shrink: 0;
        }

        .status-pill {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.02em;
          padding: 4px 10px;
          border-radius: 20px;
          color: var(--text-muted);
          background: rgba(255,255,255,0.05);
        }

        .status-pill.PAID { color: var(--success); background: var(--success-bg); }
        .status-pill.RESERVED { color: var(--pending); background: var(--pending-bg); }

        .btn-pay {
          padding: 6px 13px;
          background: var(--accent);
          border: none;
          border-radius: 7px;
          color: white;
          font-family: var(--font);
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
          transition: background 0.15s ease;
        }

        .btn-pay:hover { background: var(--accent-hover); }

        .footnote {
          text-align: center;
          color: var(--text-faint);
          font-size: 12px;
          margin-top: 32px;
        }

        @media (max-width: 480px) {
          .wrap { padding: 32px 16px 48px; }
          #auth-section { margin-top: 16px; }
        }
    </style>
</head>
<body>

<div class="wrap">

    <div class="top-bar">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none"><path d="M7 15L12 8L17 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="brand-name">Авиасейлс</span>
        </div>
        <span class="env-badge">Galow</span>
    </div>

    <!-- Блок авторизации -->
    <div id="auth-section">
        <div class="card">
            <p class="auth-title">Вход в аккаунт</p>
            <div class="tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>
            <div class="field">
                <input id="email" type="email" placeholder="email@example.com">
            </div>
            <div class="field">
                <input id="password" type="password" placeholder="Пароль, минимум 6 символов">
            </div>
            <button id="submit-btn" class="btn-primary" onclick="submitAuth()">Войти</button>
            <div id="msg"></div>
        </div>
    </div>

    <!-- Блок приложения после логина -->
    <div id="app-section" style="display:none;">
        <div class="card">
            <div class="user-bar">
                <span>Вы вошли как <b id="current-email"></b></span>
                <button class="btn-ghost" onclick="logout()">Выйти</button>
            </div>
        </div>

        <div class="card">
            <h3>Доступные рейсы</h3>
            <div id="flights-list"></div>
        </div>

        <div class="card">
            <h3>Мои билеты</h3>
            <div id="tickets-list"></div>
        </div>
    </div>

    <p class="footnote">тест приложение</p>

</div>

<script src="app.js"></script>
</body>
</html>
